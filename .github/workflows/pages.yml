name: PatriaSoul · Provjera i objava zajednice

on:
  push:
    branches: [main, cleanup-current-community-2026-10, feature/cuvari-nasljeda-social-wall-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patriasoul-community-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v6

      - name: Postavi Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provjeri sintaksu Workera i portal skripte
        run: |
          node --check worker.js
          node --check assets/js/portal.js
          node --check assets/js/auth.js
          node --check assets/js/social-wall.js
          node --check assets/js/community-hub.js
          node --check assets/js/public-profile.js
          node --check assets/js/admin.js
          node --check assets/js/search.js
          node --check scripts/build/generate-discovery.js

      - name: Provjeri strukturu i sačuvane funkcije
        run: node scripts/qa/qa-structure.js

      - name: Generiraj sitemap, robots, pretragu i RSS iz postojećih stranica
        run: node scripts/build/generate-discovery.js

      - name: Provjeri sitemap i robots
        run: node scripts/qa/qa-discovery.js

      - name: Provjeri stranicu vremena
        run: |
          grep -q "weather-page.css" stranice/vrijeme.html
          test -s assets/css/weather-page.css
          test -s data/dhmz-data.json

      - name: Provjeri stranicu Na današnji dan
        run: |
          test -s stranice/na-danasnji-dan.html
          test -s data/na-danasnji-dan.json

      - name: Provjeri osnovne poveznice zajednice
        run: node scripts/qa/qa-community.js

      - name: Izgradi Hrvatski kviz
        working-directory: kviz
        run: |
          npm install
          npm run build

      - name: Pripremi izlazne datoteke
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='kviz/dist' --exclude='kviz/node_modules' ./ _site/
          rm -rf _site/kviz
          mkdir -p _site/kviz
          cp -R kviz/dist/. _site/kviz/

      - name: Postavi službeni favicon
        run: node scripts/build/ensure-favicon.js _site

      - name: Provjeri interne poveznice
        run: node scripts/qa/qa-links.js _site

      - name: Provjeri izlazne datoteke
        run: |
          test -s _site/index.html
          test -s _site/stranice/domoljubni-forum.html
          test -s _site/stranice/grupe-dogadjaji.html
          test -s _site/stranice/profil.html
          test -s _site/stranice/poruke-obavijesti.html
          test -s _site/stranice/vrijeme.html
          test -s _site/stranice/na-danasnji-dan.html
          test -s _site/kviz/index.html
          test -s _site/sitemap.xml
          test -s _site/robots.txt

      - name: Probna Wrangler izgradnja bez objave
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Spremi portal za objavu
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-assets
          path: _site
          if-no-files-found: error
          retention-days: 1

  deploy-preview-worker:
    if: github.ref == 'refs/heads/feature/cuvari-nasljeda-social-wall-v1'
    needs: build
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Preuzmi postavke Workera
        uses: actions/checkout@v6

      - name: Postavi Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provjeri jesu li dostupni Cloudflare podaci
        run: |
          test -n "$CF_API_TOKEN" || (echo "::error::Nedostaje CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "::error::Nedostaje CLOUDFLARE_ACCOUNT_ID"; exit 1)

      - name: Preuzmi provjereni portal
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-worker-assets
          path: _site

      - name: Objavi odvojeni pregledni portal
        run: npx --yes wrangler@4 deploy --name ps-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provjeri ključne stranice pregleda
        run: |
          for path in / /stranice/profil.html /stranice/domoljubni-forum.html /stranice/grupe-dogadjaji.html /stranice/poruke-obavijesti.html; do
            curl --fail --silent --show-error "https://ps-preview.patriasoul.workers.dev$path" -o /dev/null
          done

  deploy-cloudflare-worker:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ps.patriasoul.workers.dev/
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Preuzmi postavke Workera
        uses: actions/checkout@v6

      - name: Postavi Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provjeri jesu li dostupni Cloudflare podaci
        run: |
          test -n "$CF_API_TOKEN" || (echo "::error::Nedostaje CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "::error::Nedostaje CLOUDFLARE_ACCOUNT_ID"; exit 1)

      - name: Preuzmi provjereni portal
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-worker-assets
          path: _site

      - name: Objavi portal na Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provjeri ključne stranice nakon objave
        run: node scripts/qa/qa-live.js
        env:
          BASE_URL: https://ps.patriasoul.workers.dev
