name: PatriaSoul · Build i objava

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patriasoul-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ps.patriasoul.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provjeri strukturu i sintaksu
        run: |
          node --check worker.js
          node --check assets/js/portal.js
          node --check assets/js/admin.js
          node scripts/qa/qa-structure.js
      - name: Izgradi Hrvatski kviz
        working-directory: kviz
        run: |
          npm install
          npm run build
      - name: Pripremi statičke datoteke za Cloudflare
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='kviz/src' --exclude='kviz/node_modules' --exclude='kviz/dist' --exclude='scripts' --exclude='docs' --exclude='recovery' --exclude='node_modules' ./ _site/
          rm -rf _site/kviz
          mkdir -p _site/kviz
          cp -R kviz/dist/. _site/kviz/
          test -s _site/index.html
          test -s _site/kviz/index.html
          test -s _site/stranice/domoljubni-forum.html
          test -s _site/stranice/poruke-obavijesti.html
          test -s _site/assets/js/auth.js
      - name: Probna izgradnja Workera
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Objavi PatriaSoul
        run: npx --yes wrangler@4 deploy
