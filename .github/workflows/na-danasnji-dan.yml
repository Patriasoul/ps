name: PatriaSoul · Na današnji dan

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    paths:
      - "scripts/build/update-na-danasnji-dan.js"
      - ".github/workflows/na-danasnji-dan.yml"

permissions:
  contents: write

concurrency:
  group: patriasoul-na-danasnji-dan-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout najnovijeg maina
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ažuriraj podatke s hrvatske Wikipedije
        run: node scripts/build/update-na-danasnji-dan.js

      - name: Sinkroniziraj s najnovijim mainom
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PatriaSoul Bot"
          git config user.email "patriasoul@protonmail.com"
          git fetch origin main
          git reset --mixed origin/main

      - name: Spremi osvježene podatke bez rebase konflikta
        shell: bash
        run: |
          set -euo pipefail
          git add data/na-danasnji-dan.json
          if git diff --cached --quiet -- data/na-danasnji-dan.json; then
            echo "Nema promjene podataka."
            exit 0
          fi
          git commit -m "Na današnji dan: osvježi podatke"
          git push origin HEAD:main
