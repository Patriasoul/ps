<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Privatne poruke i obavijesti na PatriaSoul portalu.">
<title>Poruke i obavijesti — PatriaSoul</title>
<link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/header.css"><link rel="stylesheet" href="../assets/css/navigation.css"><link rel="stylesheet" href="../assets/css/footer.css"><link rel="stylesheet" href="../assets/css/responsive.css">
<style>
.psm{max-width:1100px;margin:30px auto;padding:0 18px;color:#20252b}.psm *{box-sizing:border-box}.psm-hero{padding:26px;border-radius:16px;background:linear-gradient(125deg,#172c46,#294b6b);color:#fff}.psm-hero h1{margin:5px 0 8px}.psm-hero p{margin:0;color:#e5edf5}.psm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.psm button,.psm .psm-link{border:1px solid #d6dce2;border-radius:9px;padding:10px 14px;background:#fff;color:#20252b;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.psm button:hover,.psm .psm-link:hover{border-color:#b51224}.psm button.active,.psm .primary{background:#b51224;border-color:#b51224;color:#fff}.psm-layout{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:18px}.psm-panel{border:1px solid #e0e5e9;border-radius:13px;background:#fff;padding:18px;min-width:0}.psm-panel h2{font-size:1.25rem;margin:0 0 14px}.psm input,.psm textarea{width:100%;border:1px solid #cbd2d9;border-radius:8px;padding:11px;font:inherit;margin:6px 0 12px}.psm textarea{min-height:100px;resize:vertical}.psm .item{display:block;width:100%;text-align:left;margin:7px 0;padding:13px;white-space:normal}.psm .item strong,.psm .item small{display:block}.psm small,.psm .muted{color:#687581}.psm .item small{font-weight:400;margin-top:4px}.psm .thread{height:360px;overflow:auto;border:1px solid #e5e9ed;border-radius:9px;padding:12px;margin-bottom:12px;background:#f8fafb}.psm .bubble{max-width:88%;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e2e6ea;margin:9px 0;overflow-wrap:anywhere}.psm .bubble.mine{margin-left:auto;background:#edf4ff;border-color:#d6e4fb}.psm .bubble small{display:block;margin-top:6px;font-size:.75rem}.psm .notice{padding:13px;border:1px solid #e0e5e9;border-radius:10px;margin:8px 0}.psm .notice.unread{border-left:4px solid #b51224;background:#fffafa}.psm .empty{padding:22px;border:1px dashed #cbd2d9;border-radius:10px;color:#687581}.psm .status{margin:12px 0;padding:11px;border-radius:8px;background:#f2f5f8}.psm .newform{margin:14px 0;padding:14px;background:#f7f9fb;border-radius:10px}.psm [hidden]{display:none!important}@media(max-width:760px){.psm-layout{grid-template-columns:1fr}.psm-hero{padding:20px}.psm .thread{height:300px}}
</style>
</head>
<body>
<main class="psm" hidden>
<section class="psm-hero"><div><small style="color:#f0d4d8">PATRIASOUL · ZAJEDNICA</small><h1>Poruke i obavijesti</h1><p>Privatni razgovori i obavijesti vezane uz tvoj račun.</p></div></section>
<div class="psm-tabs"><button class="active" data-tab="messages">✉ Poruke <span id="message-count"></span></button><button data-tab="notifications">♧ Obavijesti <span id="notification-count"></span></button><a class="psm-link" href="../index.html">Natrag na portal</a></div>
<div id="status" class="status">Provjeravam prijavu…</div>
<section id="messages-view">
<div class="psm-layout">
<aside class="psm-panel"><h2>Razgovori</h2><button class="primary" id="new-conversation">+ Nova poruka</button><div id="new-form" class="newform" hidden><label for="people-search">Pronađi korisnika po nadimku</label><input id="people-search" placeholder="Upiši barem 3 slova"><div id="people-results"></div></div><div id="conversation-list" class="muted">Učitavam razgovore…</div></aside>
<section class="psm-panel"><h2 id="thread-title">Odaberi razgovor</h2><div id="thread" class="thread"><div class="empty">Odaberi razgovor ili započni novu poruku.</div></div><form id="send-form" hidden><label for="message-body">Poruka</label><textarea id="message-body" maxlength="5000" required placeholder="Napiši poruku…"></textarea><button class="primary" type="submit">Pošalji poruku</button></form></section>
</div>
</section>
<span id="obavijesti" aria-hidden="true"></span>
<section id="notifications-view" hidden class="psm-panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Obavijesti</h2><button id="mark-all">Označi sve pročitanima</button></div><div id="notification-list">Učitavam obavijesti…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const URL='https://ijimozjfdffejbczwyzb.supabase.co',KEY='sb_publishable_SvuPtQUmXamt1a1_JpU6Jg_Bf3Fshqr';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const db=window.supabase.createClient(URL,KEY);let user=null,activeId=null,conversations=[];
const status=t=>{$('status').textContent=t;$('status').hidden=!t};
const date=s=>s?new Date(s).toLocaleString('hr-HR',{dateStyle:'short',timeStyle:'short'}):'';
function tab(which){$('messages-view').hidden=which!=='messages';$('notifications-view').hidden=which!=='notifications';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===which));if(which==='notifications')loadNotifications()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
async function init(){try{const r=await db.auth.getUser();user=r.data?.user;if(!user){const next=encodeURIComponent(location.href);location.replace(new URL('prijava.html?next='+next,location.href).href.replace('/poruke-obavijesti.html','/prijava.html'));return}$('status').hidden=true;document.querySelector('main.psm').hidden=false;await Promise.all([loadConversations(),loadNotifications()])}catch(e){status('Greška pri povezivanju: '+e.message)}}
async function loadConversations(){const m=await db.from('private_conversation_members').select('conversation_id,last_read_at').eq('user_id',user.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.conversation_id);if(!ids.length){$('conversation-list').innerHTML='<div class="empty">Još nema razgovora. Odaberi „Nova poruka” za početak.</div>';return}
const [cs,ms,peerResult]=await Promise.all([db.from('private_conversations').select('id,created_at,last_message_at').in('id',ids).order('last_message_at',{ascending:false,nullsFirst:false}),db.from('private_messages').select('conversation_id,body,sender_id,created_at').in('conversation_id',ids).order('created_at',{ascending:false}),db.rpc('get_private_conversation_peers')]);
if(cs.error)throw cs.error;if(ms.error)throw ms.error;if(peerResult.error)throw peerResult.error;
const names={};const memberBy=peerResult.data||[];memberBy.forEach(x=>names[x.user_id]=x.display_name||'Korisnik');
conversations=cs.data||[];const latest={};(ms.data||[]).forEach(x=>{if(!latest[x.conversation_id])latest[x.conversation_id]=x});const unread=(ms.data||[]).filter(x=>x.sender_id!==user.id&&(!((m.data||[]).find(y=>y.conversation_id===x.conversation_id)?.last_read_at)||new Date(x.created_at)>new Date((m.data||[]).find(y=>y.conversation_id===x.conversation_id).last_read_at))).length;
$('message-count').textContent=unread?'('+unread+')':'';$('conversation-list').innerHTML=conversations.map(c=>{const peer=memberBy.find(x=>x.conversation_id===c.id)?.user_id;const last=latest[c.id];return '<button class="item" data-conv="'+c.id+'"><strong>'+esc(names[peer]||'Razgovor')+'</strong><small>'+esc(last?.body||'Započni razgovor')+'</small><small>'+esc(date(last?.created_at||c.created_at))+'</small></button>'}).join('');
$('conversation-list').querySelectorAll('[data-conv]').forEach(b=>b.addEventListener('click',()=>openConversation(b.dataset.conv,names)));
if(activeId&&!conversations.some(c=>c.id===activeId))activeId=null}
async function openConversation(id,names={}){activeId=id;const c=conversations.find(x=>x.id===id);const members=await db.rpc('get_private_conversation_peers');let peerName='Razgovor';const peer=(members.data||[]).find(x=>x.conversation_id===id);if(peer)peerName=peer.display_name||names[peer.user_id]||peerName
$('thread-title').textContent=peerName;const r=await db.from('private_messages').select('id,sender_id,body,created_at').eq('conversation_id',id).order('created_at');if(r.error){status('Ne mogu učitati razgovor: '+r.error.message);return}
$('thread').innerHTML=(r.data||[]).map(x=>'<div class="bubble '+(x.sender_id===user.id?'mine':'')+'">'+esc(x.body).replace(/\n/g,'<br>')+'<small>'+esc(date(x.created_at))+(x.sender_id===user.id?' · Ti':'')+'</small></div>').join('')||'<div class="empty">Ovo je početak razgovora.</div>';$('thread').scrollTop=$('thread').scrollHeight;$('send-form').hidden=false;
await db.from('private_conversation_members').update({last_read_at:new Date().toISOString()}).eq('conversation_id',id).eq('user_id',user.id).select().maybeSingle()}
$('send-form').addEventListener('submit',async e=>{e.preventDefault();if(!activeId||!user)return;const body=$('message-body').value.trim();if(!body)return;const b=e.submitter;b.disabled=true;const r=await db.from('private_messages').insert({conversation_id:activeId,sender_id:user.id,body});b.disabled=false;if(r.error){status('Poruka nije poslana: '+r.error.message);return}$('message-body').value='';await openConversation(activeId);await loadConversations()});
$('new-conversation').addEventListener('click',()=>{$('new-form').hidden=!$('new-form').hidden;$('people-search').focus()});
let searchTimer; $('people-search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchPeople,250)});
async function searchPeople(){const q=$('people-search').value.trim();if(q.length<3){$('people-results').innerHTML='<small>Upiši barem 3 slova.</small>';return}const r=await db.from('profiles').select('id,display_name').ilike('display_name','%'+q.replace(/[%_]/g,'')+'%').neq('id',user.id).limit(10);if(r.error){$('people-results').innerHTML='<small>Pretraga nije dostupna: '+esc(r.error.message)+'</small>';return} $('people-results').innerHTML=(r.data||[]).map(p=>'<button class="item" data-person="'+p.id+'"><strong>'+esc(p.display_name||'Korisnik')+'</strong><small>Otvori razgovor</small></button>').join('')||'<small>Nema pronađenih korisnika.</small>'; $('people-results').querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>startConversation(b.dataset.person)))}
async function startConversation(other){status('Otvaram razgovor…');const peers=await db.rpc('get_private_conversation_peers');const existing=(peers.data||[]).find(x=>x.user_id===other);if(existing){activeId=existing.conversation_id;await loadConversations();await openConversation(activeId);$('new-form').hidden=true;status('');return}
const c=await db.from('private_conversations').insert({created_by:user.id}).select('id').single();if(c.error){status('Ne mogu otvoriti razgovor: '+c.error.message);return}
const mm=await db.from('private_conversation_members').insert([{conversation_id:c.data.id,user_id:user.id},{conversation_id:c.data.id,user_id:other}]);if(mm.error){status('Razgovor nije dovršen: '+mm.error.message);return}
activeId=c.data.id;$('new-form').hidden=true;await loadConversations();await openConversation(activeId);status('')}
async function loadNotifications(){if(!user)return;const r=await db.from('user_notifications').select('id,title,body,kind,target_url,read_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);if(r.error){$('notification-list').innerHTML='<div class="empty">Obavijesti se ne mogu učitati: '+esc(r.error.message)+'</div>';return}const data=r.data||[],unread=data.filter(x=>!x.read_at).length;$('notification-count').textContent=unread?'('+unread+')':'';$('notification-list').innerHTML=data.map(n=>'<article class="notice '+(!n.read_at?'unread':'')+'"><strong>'+esc(n.title)+'</strong><p>'+esc(n.body)+'</p><small>'+esc(date(n.created_at))+' · '+(!n.read_at?'Nepročitano':'Pročitano')+'</small><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+(n.target_url?'<a class="psm-link" href="'+esc(n.target_url)+'">Otvori</a>':'')+(!n.read_at?'<button data-read="'+n.id+'">Označi pročitanom</button>':'')+'</div></article>').join('')||'<div class="empty">Trenutačno nema obavijesti.</div>';$('notification-list').querySelectorAll('[data-read]').forEach(b=>b.addEventListener('click',async()=>{const u=await db.from('user_notifications').update({read_at:new Date().toISOString()}).eq('id',b.dataset.read).eq('user_id',user.id);if(u.error){status('Nije moguće označiti obavijest: '+u.error.message);return}await loadNotifications()}))}
$('mark-all').addEventListener('click',async()=>{if(!user)return;const r=await db.from('user_notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null);if(r.error){status('Greška: '+r.error.message);return}await loadNotifications()});
if(location.hash==='#obavijesti'||location.hash==='#interakcije')tab('notifications');else if(location.hash==='#poruke')tab('messages');
init().catch(e=>status('Greška: '+e.message));
})();
</script>
<script src="../assets/js/portal.js?v=20261009-mobile-menu"></script>
</body></html>
