<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Domoljubni forum PatriaSoul — razgovori o Hrvatskoj, povijesti, vjeri, obitelji i baštini.">
<title>Domoljubni forum — PatriaSoul</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/header.css">
<link rel="stylesheet" href="../assets/css/navigation.css">
<link rel="stylesheet" href="../assets/css/footer.css">
<style>
:root{--forum-red:#b51224;--forum-ink:#20252b;--forum-muted:#65717d;--forum-line:#e2e6ea}
.psf-shell{max-width:1120px;margin:32px auto;padding:0 18px;color:var(--forum-ink)}.psf-shell *{box-sizing:border-box}.psf-head{display:flex;gap:24px;align-items:center;justify-content:space-between;padding:28px;border-radius:16px;background:linear-gradient(125deg,#172c46,#263f5c);color:#fff}.psf-head h1{font-size:clamp(2rem,4vw,3rem);margin:8px 0}.psf-head p{margin:0;color:#e3eaf1}.psf-head small{letter-spacing:.12em;text-transform:uppercase;color:#f4d9dd}.psf-actions{display:flex;gap:8px;flex-wrap:wrap}.psf-shell button,.psf-shell .psf-link{border:1px solid var(--forum-line);border-radius:9px;padding:10px 14px;background:#fff;color:var(--forum-ink);font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.psf-shell button:hover,.psf-shell .psf-link:hover{border-color:var(--forum-red)}.psf-shell .psf-red{background:var(--forum-red);border-color:var(--forum-red);color:#fff}.psf-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 14px}.psf-top h2{margin:3px 0}.psf-top p{color:var(--forum-muted);margin:4px 0}.psf-kicker{font-size:.78rem;letter-spacing:.12em;color:var(--forum-red);font-weight:800}.psf-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.psf-cats button{text-align:left;min-height:115px;padding:18px}.psf-cats b,.psf-topics b{display:block;font-size:1.08rem;margin-bottom:7px}.psf-cats span,.psf-topics span{display:block;color:var(--forum-muted);font-weight:400;line-height:1.5}.psf-topics{display:grid;gap:10px}.psf-topics button{text-align:left;padding:16px}.psf-card,.psf-topic,.psf-posts article{border:1px solid var(--forum-line);border-radius:12px;padding:20px;margin:12px 0;background:#fff}.psf-card{max-width:700px;margin:24px auto}.psf-shell form{display:grid;gap:12px}.psf-shell input,.psf-shell select,.psf-shell textarea{width:100%;padding:12px;border:1px solid #cbd2d9;border-radius:8px;font:inherit}.psf-shell textarea{min-height:140px;resize:vertical}.psf-shell label{display:flex;gap:8px;align-items:flex-start}.psf-shell label input{width:auto;margin-top:5px}.psf-msg{padding:12px 15px;margin:14px 0;border-radius:8px;background:#fff0f0;color:#8b1020}.psf-posts article p{line-height:1.7;overflow-wrap:anywhere}.psf-posts article small{display:block;color:var(--forum-muted);margin-top:5px}.psf-posts article button{margin-right:8px}.psf-empty{padding:24px;border:1px dashed #cbd2d9;border-radius:10px;color:var(--forum-muted)}@media(max-width:760px){.psf-head{align-items:flex-start;flex-direction:column;padding:22px}.psf-cats{grid-template-columns:1fr}.psf-top{align-items:flex-start;flex-direction:column}.psf-shell{margin:18px auto}}
</style>
</head>
<body>
<main class="psf-shell">
<header class="psf-head"><div><small>PatriaSoul · Čuvari nasljeđa</small><h1>Domoljubni forum</h1><p>Razgovarajmo s poštovanjem, činjenicama i odgovornošću.</p></div><nav class="psf-actions" id="psf-auth-actions"><a class="psf-link" href="../index.html">PatriaSoul</a></nav></header>
<div id="psf-msg" class="psf-msg" hidden></div><div id="patriasoul-forum"><p>Učitavam rubrike foruma…</p></div>
</main>
<script>
window.PSQuizConfig={supabaseUrl:'https://ijimozjfdffejbczwyzb.supabase.co',supabaseKey:'sb_publishable_SvuPtQUmXamt1a1_JpU6Jg_Bf3Fshqr',siteUrl:'../',quizUrl:'../kviz/'};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{const root=document.getElementById('patriasoul-forum'),msg=document.getElementById('psf-msg'),actions=document.getElementById('psf-auth-actions'),cfg=window.PSQuizConfig;let client,user,category,topic;root.hidden=true;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>{msg.textContent=t||'';msg.hidden=!t};
const db=()=>client||(client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey));
const auth=async()=>{const r=await db().auth.getUser();user=r.data?.user||null;if(actions){actions.innerHTML='<a class="psf-link" href="../index.html">PatriaSoul</a>'+(user?'<button data-a="logout">Odjava</button>':'<button data-a="login">Prijava</button><button data-a="register">Registracija</button>')}};
const need=()=>{if(user)return true;say('Za sudjelovanje u forumu prijavi se ili izradi račun.');return false};
async function cats(){const r=await db().from('forum_categories').select('id,name,description').eq('is_active',true).order('sort_order');if(r.error)throw r.error;return r.data||[]}
async function topics(id){const r=await db().from('forum_topics').select('id,category_id,user_id,title,status,is_pinned,created_at,updated_at,profiles(display_name)').eq('category_id',id).order('is_pinned',{ascending:false}).order('updated_at',{ascending:false}).limit(50);if(r.error)throw r.error;return r.data||[]}
async function posts(id){const r=await db().from('forum_posts').select('id,topic_id,user_id,content,status,created_at,profiles(display_name)').eq('topic_id',id).order('created_at');if(r.error)throw r.error;return r.data||[]}
async function home(){category=null;const a=await cats();root.innerHTML='<div class="psf-top"><div><span class="psf-kicker">ZAJEDNICA</span><h2>Rubrike foruma</h2><p>Odaberi rubriku i uključi se u razgovor.</p></div>'+(user?'<button class="psf-red" data-a="new">+ Nova tema</button>':'')+'</div><div class="psf-cats">'+a.map(c=>'<button data-cat="'+esc(c.id)+'"><b>'+esc(c.name)+'</b><span>'+esc(c.description||'')+'</span></button>').join('')+'</div>'}
async function showTopics(id){const a=await cats();category=a.find(c=>c.id===id);const ts=await topics(id);root.innerHTML='<button data-a="home">← Sve rubrike</button><div class="psf-top"><div><span class="psf-kicker">RUBRIKA</span><h2>'+esc(category?.name||'Forum')+'</h2><p>'+esc(category?.description||'')+'</p></div>'+(user?'<button class="psf-red" data-a="new">+ Nova tema</button>':'')+'</div><div class="psf-topics">'+(ts.length?ts.map(t=>'<button data-topic="'+esc(t.id)+'"><b>'+(t.is_pinned?'📌 ':'')+esc(t.title)+'</b><span>'+esc(t.profiles?.display_name||'Član')+' · '+new Date(t.updated_at).toLocaleDateString('hr-HR')+'</span></button>').join(''):'<div class="psf-empty">U ovoj rubrici još nema tema. Budi prvi koji će pokrenuti razgovor.</div>')+'</div>'}
async function showTopic(id){const r=await db().from('forum_topics').select('id,category_id,user_id,title,status,is_pinned,created_at,profiles(display_name)').eq('id',id).single();if(r.error)throw r.error;topic=r.data;const ps=await posts(id);root.innerHTML='<button data-cat="'+esc(topic.category_id)+'">← Natrag na rubriku</button><article class="psf-topic"><span class="psf-kicker">TEMA</span><h2>'+esc(topic.title)+'</h2><button class="psf-red" type="button" data-share-topic="'+esc(topic.id)+'">Podijeli na zid</button><p>'+esc(topic.profiles?.display_name||'Član')+' · '+new Date(topic.created_at).toLocaleString('hr-HR')+'</p></article><div class="psf-posts">'+(ps.length?ps.map(p=>'<article><b>'+esc(p.profiles?.display_name||'Član')+'</b><small>'+new Date(p.created_at).toLocaleString('hr-HR')+'</small><p>'+esc(p.content).replace(/\n/g,'<br>')+'</p>'+(user?'<button data-report="'+esc(p.id)+'">Prijavi objavu</button>':'')+(user&&user.id===p.user_id?'<button data-del="'+esc(p.id)+'">Obriši svoju objavu</button>':'')+'</article>').join(''):'<div class="psf-empty">Nema objava.</div>')+'</div>'+(topic.status==='locked'?'<p>Tema je zaključana.</p>':user?'<form id="reply"><label for="reply-content">Tvoj odgovor</label><textarea id="reply-content" name="content" maxlength="4000" required placeholder="Napiši odgovor…"></textarea><button class="psf-red">Objavi odgovor</button></form>':'<p>Za odgovaranje se prijavi.</p>')}
async function formView(which){if(which==='new'){if(!need())return;const a=await cats();root.innerHTML='<section class="psf-card"><h2>Pokreni novu temu</h2><form id="newtopic"><label>Rubrika<select name="category_id">'+a.map(c=>'<option value="'+esc(c.id)+'" '+(category&&category.id===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label><label>Naslov teme<input name="title" minlength="5" maxlength="160" required placeholder="O čemu želiš razgovarati?"></label><label>Prva poruka<textarea name="content" maxlength="4000" required placeholder="Objasni temu i napiši što želiš podijeliti…"></textarea></label><button class="psf-red">Objavi temu</button></form></section>';return}
root.innerHTML='<section class="psf-card"><h2>'+(which==='login'?'Prijava':'Registracija')+'</h2><form id="'+which+'">'+(which==='register'?'<label>Prikazno ime<input name="name" required maxlength="60"></label>':'')+'<label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Lozinka<input name="password" type="password" minlength="'+(which==='register'?8:1)+'" required autocomplete="'+(which==='login'?'current-password':'new-password')+'"></label><label><input type="checkbox" required> Prihvaćam <a href="../stranice/pravila-foruma.html">Pravila foruma</a> i <a href="privatnost.html">Politiku privatnosti</a>.</label><button class="psf-red">'+(which==='login'?'Prijavi se':'Izradi račun')+'</button></form></section>'}
root.addEventListener('click',async ev=>{const b=ev.target.closest('[data-a],[data-cat],[data-topic],[data-report],[data-del],[data-share-topic]');if(!b)return;try{say('');if(b.dataset.shareTopic){const topicUrl=new URL(location.href);topicUrl.searchParams.set('topic',b.dataset.shareTopic);const wallUrl=new URL('../stranice/zid-zajednice.html',location.href);wallUrl.searchParams.set('shareType','forum');wallUrl.searchParams.set('shareTitle',topic?.title||'Tema na Domoljubnom forumu');wallUrl.searchParams.set('shareUrl',topicUrl.href);wallUrl.searchParams.set('shareText','Pogledaj ovu temu na Domoljubnom forumu PatriaSoul.');location.href=wallUrl.href;return}if(b.dataset.cat){await showTopics(b.dataset.cat);return}if(b.dataset.topic){await showTopic(b.dataset.topic);return}if(b.dataset.report){if(!need())return;const reason=prompt('Ukratko navedi razlog prijave:');if(!reason)return;const q=await db().from('forum_reports').insert({post_id:b.dataset.report,reporter_id:user.id,reason:reason.trim()});if(q.error)throw q.error;say('Prijava je poslana moderatorima.');return}if(b.dataset.del){if(!need()||!confirm('Obrisati svoju objavu?'))return;const q=await db().from('forum_posts').delete().eq('id',b.dataset.del).eq('user_id',user.id);if(q.error)throw q.error;await showTopic(topic.id);return}switch(b.dataset.a){case'home':await home();break;case'new':await formView('new');break;case'login':case'register':await formView(b.dataset.a);break;case'logout':await db().auth.signOut();await auth();await home();break}}catch(e){say(e.message||'Došlo je do pogreške. Pokušaj ponovno.') }});
root.addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{say('');let q;if(ev.target.id==='login'){q=await db().auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(q.error)throw q.error;await auth();await home();say('Uspješno si prijavljen.')}else if(ev.target.id==='register'){q=await db().auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{full_name:String(f.get('name')).trim(),display_name:String(f.get('name')).trim()}}});if(q.error)throw q.error;await auth();await home();say(q.data.session?'Račun je izrađen.':'Račun je izrađen. Provjeri e-mail radi potvrde.')}else if(ev.target.id==='newtopic'){if(!need())return;q=await db().from('forum_topics').insert({category_id:f.get('category_id'),user_id:user.id,title:String(f.get('title')).trim()}).select('id').single();if(q.error)throw q.error;const p=await db().from('forum_posts').insert({topic_id:q.data.id,user_id:user.id,content:String(f.get('content')).trim()});if(p.error)throw p.error;await showTopic(q.data.id)}else if(ev.target.id==='reply'){if(!need())return;q=await db().from('forum_posts').insert({topic_id:topic.id,user_id:user.id,content:String(f.get('content')).trim()});if(q.error)throw q.error;await showTopic(topic.id)}}catch(e){say(e.message||'Došlo je do pogreške.')}})
;(async()=>{try{if(!root){console.error('PatriaSoul forum: nedostaje element #patriasoul-forum.');say('Forum se ne može prikazati jer nedostaje glavni element stranice.');return}await auth();if(!user){const next=encodeURIComponent(location.href);location.replace(new URL('../stranice/prijava.html?next='+next,location.href).href);return}root.hidden=false;const deepTopic=new URLSearchParams(location.search).get('topic');if(deepTopic)await showTopic(deepTopic);else await home()}catch(e){console.error('PatriaSoul forum — inicijalizacija:',e);if(root){root.hidden=false;root.innerHTML='<div class="psf-empty"><b>Forum se trenutačno ne može povezati s bazom.</b><p>'+esc(e.message||'Provjeri Supabase konfiguraciju i pravila pristupa.')+'</p></div>'}else{say('Forum se trenutačno ne može povezati s bazom. Provjeri Supabase konfiguraciju i pravila pristupa.')}}})()
})();
</script>
  <script src="../assets/js/portal.js?v=20261009-mobile-menu"></script>
</body>
</html>
