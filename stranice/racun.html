<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moj račun — PatriaSoul</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<main class="ps-auth-page">
<section class="ps-auth-card" id="account-card">
<p class="ps-kicker">PATRIASOUL · KORISNIČKI RAČUN</p>
<h1>Moj račun</h1>
<p id="account-status">Provjeravam prijavu...</p>
<div id="account-content" hidden>
<div class="ps-account-avatar" aria-hidden="true">PS</div>
<p><strong id="account-name">Čitatelj</strong></p>
<p id="account-email"></p>
<p id="account-role"></p>
<form id="account-form" class="ps-auth-form">
<label>Ime za prikaz<input id="display-name" required minlength="2" maxlength="80" autocomplete="nickname"></label>
<button type="submit">Spremi promjene</button>
<p id="account-msg" class="ps-auth-message" role="status" aria-live="polite"></p>
</form>
<div class="ps-account-actions">
<a href="../index.html">Naslovnica</a>
<a href="../index.html">Najnovije</a>
<a href="/stranice/prijava.html" id="logout-link">Odjavi se</a>
</div>
</div>
<div id="account-login" hidden>
<p>Za pregled računa morate biti prijavljeni.</p>
<a href="/stranice/prijava.html">Prijavi se</a>
</div>
</section>
</main>
<script src="../assets/js/portal.js?v=20261014-1"></script>
<script src="../assets/js/auth.js?v=20261014-1"></script>
<script>
(async()=>{
 const status=document.getElementById("account-status"),content=document.getElementById("account-content"),login=document.getElementById("account-login");
 try{
  const user=await PatriaSoulAuth.getUser();
  if(!user){status.hidden=true;login.hidden=false;return}
  const client=await PatriaSoulAuth.client();
  const {data:profile}=await client.from("profiles").select("display_name,role,avatar_url,created_at").eq("id",user.id).maybeSingle();
  const name=profile?.display_name||user.user_metadata?.display_name||user.email?.split("@")[0]||"Čitatelj";
  document.getElementById("account-name").textContent=name;
  document.getElementById("account-email").textContent=user.email||"";
  document.getElementById("account-role").textContent=profile?.role==="admin"?"Administrator":"Član PatriaSoul zajednice";
  document.getElementById("display-name").value=name;
  status.hidden=true;content.hidden=false;
  document.getElementById("account-form").addEventListener("submit",async e=>{
   e.preventDefault();
   const msg=document.getElementById("account-msg"),button=e.currentTarget.querySelector("button");
   button.disabled=true;msg.textContent="Spremanje...";
   try{
    const value=document.getElementById("display-name").value.trim();
    if(value.length<2)throw new Error("Ime za prikaz mora imati najmanje 2 znaka.");
    const {error}=await client.from("profiles").update({display_name:value,updated_at:new Date().toISOString()}).eq("id",user.id);
    if(error)throw error;
    const {error:authError}=await client.auth.updateUser({data:{display_name:value}});
    if(authError)throw authError;
    document.getElementById("account-name").textContent=value;msg.textContent="Promjene su spremljene.";
   }catch(err){msg.textContent=err.message||"Promjene nisu spremljene."}finally{button.disabled=false}
  });
  document.getElementById("logout-link").addEventListener("click",async e=>{
   e.preventDefault();
   await PatriaSoulAuth.signOut();
   location.href="/stranice/prijava.html";
  });
 }catch(err){status.textContent="Prijava se nije mogla provjeriti. Pokušajte ponovno.";console.error(err)}
})();
</script>
</body></html>
