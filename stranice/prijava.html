<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — PatriaSoul</title><link rel="stylesheet" href="../assets/css/base.css"><style>.ps-auth-legal-note{font-size:.86rem;line-height:1.55;color:#526173;margin:14px 0}.ps-auth-legal-note a{font-weight:700}.ps-legal-accept{display:flex!important;align-items:flex-start;gap:10px;font-size:.95rem;line-height:1.55;margin:18px 0;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;color:#172033}.ps-legal-accept input{display:inline-block!important;appearance:auto!important;-webkit-appearance:checkbox!important;flex:0 0 18px;width:18px;height:18px;min-width:18px;margin:3px 0 0;opacity:1!important;visibility:visible!important;position:static!important}</style></head><body><main class="ps-auth-page"><section class="ps-auth-card"><p class="ps-kicker">PATRIASOUL · KORISNIČKI RAČUN</p><h1>Prijava</h1><p>Prijavite se svojim PatriaSoul računom za komentiranje članaka.</p><form id="ps-login" class="ps-auth-form"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Lozinka<input id="password" type="password" required autocomplete="current-password"></label><label class="ps-legal-accept"><input id="accept-rules" type="checkbox" required> <span>Prihvaćam <a href="/pravila-koristenja-i-sigurnosti/" target="_blank" rel="noopener">Pravila korištenja i sigurnosti PatriaSoul portala</a>.</span></label><button type="submit">Prijavi se</button><p id="msg" class="ps-auth-message" role="status" aria-live="polite"></p></form><p class="ps-auth-legal-note">Korištenjem računa primjenjuju se <a href="/pravila-koristenja-i-sigurnosti/">Pravila korištenja i sigurnosti</a>. Pročitajte i <a href="/privatnost/">Obavijest o privatnosti i zaštiti osobnih podataka</a>.</p><p class="ps-auth-link">Nemate račun? <a href="/registracija/">Registrirajte se</a></p></section></main><script src="../assets/js/portal.js?v=20261014-1"></script><script src="../assets/js/auth.js?v=20261014-1"></script><script>document.getElementById("ps-login").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,m=document.getElementById("msg"),button=form.querySelector("button");m.textContent="Prijava...";button.disabled=true;try{const r=await PatriaSoulAuth.signIn(document.getElementById("email").value.trim(),document.getElementById("password").value);if(r.error)throw r.error;if(r.data?.user){await PatriaSoulAuth.getUser()}let next=new URLSearchParams(location.search).get("next");try{if(!next)next=sessionStorage.getItem("patriasoul-login-next");sessionStorage.removeItem("patriasoul-login-next")}catch(_){}const target=next&&new URL(next,location.href).origin===location.origin?new URL(next,location.href).href:new URL("/racun/",location.origin).href;location.replace(target)}catch(err){m.textContent=err.message||"Prijava nije uspjela.";button.disabled=false}});</script></body></html>
