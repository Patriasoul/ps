<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registracija — PatriaSoul</title><link rel="stylesheet" href="../assets/css/base.css"><style>.ps-legal-accept{display:flex!important;align-items:flex-start;gap:10px;font-size:.95rem;line-height:1.55;margin:18px 0;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;color:#172033}.ps-legal-accept input{display:inline-block!important;appearance:auto!important;-webkit-appearance:checkbox!important;flex:0 0 18px;width:18px;height:18px;min-width:18px;margin:3px 0 0;opacity:1!important;visibility:visible!important;position:static!important}.ps-auth-legal-note{font-size:.86rem;line-height:1.55;color:#526173;margin:0}.ps-auth-legal-note a,.ps-legal-accept a{font-weight:700}</style></head><body><main class="ps-auth-page"><section class="ps-auth-card"><p class="ps-kicker">PATRIASOUL · KORISNIČKI RAČUN</p><h1>Registracija</h1><p>Izradite PatriaSoul račun. Račun je potreban za komentiranje članaka.</p><form id="ps-register" class="ps-auth-form"><label>Ime za prikaz<input id="name" required minlength="2" maxlength="80" autocomplete="nickname"></label><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Lozinka<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label class="ps-legal-accept"><input id="accept-rules" type="checkbox" required> <span>Prihvaćam <a href="/pravila-koristenja-i-sigurnosti/" target="_blank" rel="noopener">Pravila korištenja i sigurnosti PatriaSoul portala</a>.</span></label><p class="ps-auth-legal-note">Pročitajte i <a href="/privatnost/" target="_blank" rel="noopener">Obavijest o privatnosti i zaštiti osobnih podataka</a>.</p><button type="submit">Registriraj račun</button><p id="msg" class="ps-auth-message" role="status" aria-live="polite"></p></form><p class="ps-auth-legal-note">Pravila i privatnost dostupni su i u podnožju portala.</p><p class="ps-auth-link">Već imate račun? <a href="/prijava/">Prijavite se</a></p></section></main><script src="../assets/js/portal.js?v=20261014-1"></script><script src="../assets/js/auth.js?v=20261014-1"></script><script>document.getElementById("ps-register").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,m=document.getElementById("msg"),button=form.querySelector("button");m.textContent="Registracija...";button.disabled=true;try{const r=await PatriaSoulAuth.signUp(document.getElementById("email").value.trim(),document.getElementById("password").value,document.getElementById("name").value.trim());if(r.error)throw r.error;if(r.data?.session){location.href="/racun/";return}m.textContent="Račun je otvoren. Provjerite e-mail ako je potrebna potvrda.";form.reset()}catch(err){m.textContent=err.message||"Registracija nije uspjela."}finally{button.disabled=false}});</script></body></html>
